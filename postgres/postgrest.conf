# postgrest
db-uri = "postgres://authenticator:***@localhost:5432/vhf"
db-schema = "api"
db-anon-role = "web_anon"

db-pool = 10
db-pool-timeout = 10

# restrict to localhost
server-host = "127.0.0.1"
server-port = 3000

# Shared secret with the web page's login service (its PGRST_JWT_SECRET), used
# to verify the tokens of logged-in users. Kept in a separate file that is not
# in this repository, see README "Shared secret for logged-in users (JWT)".
jwt-secret = "@/etc/postgrest/jwt-secret"
